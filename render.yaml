# the shared test box on Render's free tier, as a Blueprint (docs/deploy-test.md). the database is a Neon project, it is not
# described here. nothing secret is written in this file: the sync false values are asked for once, when the Blueprint is
# created, and JWT_SECRET is generated by Render
services:
  - type: web
    name: equipment-supply-test
    runtime: docker
    plan: free
    # next to the Neon region (aws-eu-central-1) and the closest one to Israel. a region cannot be changed after creation
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/auth/mode
    # a push to the connected branch deploys it. off to deploy by hand from the dashboard
    autoDeployTrigger: commit
    envVars:
      # what this box is: not LOCAL (no developer switch), not production (that locks mock auth out). the image sets neither
      - key: ENVIRONMENT
        value: TEST
      # mock login on purpose, there is no identity provider yet. anyone with the URL is a manager, see docs/deploy-test.md
      - key: AUTH_MODE
        value: mock
      - key: ALLOW_MOCK_AUTH
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      # Render sends traffic to 10000
      - key: PORT
        value: "10000"
      # Neon refuses a plain connection. DB_HOST is the direct host (no -pooler in its name), DB_PORT is 5432
      - key: DB_SSL
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
